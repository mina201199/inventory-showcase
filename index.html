<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="展示庫存">
<meta name="theme-color" content="#f5f2ee">
<link rel="icon" href="./app-icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#315c4c">
</head>
<body>
<div class="demo-notice" role="note"><b>DEMO · 假資料展示</b><span>可自由操作；只保存於此分頁。請勿輸入正式或個人資料。</span><button class="btn sm" onclick="document.getElementById('openSettings').click()">重設／展示設定</button></div>
<title>肌研小室・進銷存展示</title>
<style>
/* Layout: 電腦＝左側導覽＋工作區；手機＝上方店名列＋底部分頁列。色調取自價目表的米杏與古銅 */
:root{
  --bg:#f5f2ee; --surface:#fffefc; --surface-2:#f2ede6; --line:#e7e0d7; --line-strong:#d5cbbe;
  --fg:#2a2420; --fg-2:#665c53; --fg-3:#94897e;
  --accent:#8a6640; --accent-ink:#ffffff; --accent-soft:#f1e7da;
  --bar:#a07a4f;
  --cash:#b1621c; --transfer:#0a7ea8;
  --good:#2e7a4b; --good-soft:#e4f1e8; --warn:#9a6208; --warn-soft:#fbefd9; --bad:#b23b33; --bad-soft:#f9e4e1;
  --shadow:0 1px 2px rgba(42,36,32,.06),0 6px 20px rgba(42,36,32,.06);
  --overlay:rgba(30,24,18,.45);
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --radius:12px;
  --tabbar-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161412; --surface:#211e1b; --surface-2:#2a2622; --line:#37312b; --line-strong:#4b433b;
    --fg:#f2ede7; --fg-2:#c3b9ad; --fg-3:#8f857a;
    --accent:#d4ad80; --accent-ink:#1d1814; --accent-soft:#3a3026;
    --bar:#c49b6c;
    --cash:#b96a24; --transfer:#1689b5;
    --good:#62c58a; --good-soft:#1f3328; --warn:#e3aa46; --warn-soft:#3a2e18; --bad:#ef7d73; --bad-soft:#3d2220;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161412; --surface:#211e1b; --surface-2:#2a2622; --line:#37312b; --line-strong:#4b433b;
  --fg:#f2ede7; --fg-2:#c3b9ad; --fg-3:#8f857a;
  --accent:#d4ad80; --accent-ink:#1d1814; --accent-soft:#3a3026;
  --bar:#c49b6c;
  --cash:#b96a24; --transfer:#1689b5;
  --good:#62c58a; --good-soft:#1f3328; --warn:#e3aa46; --warn-soft:#3a2e18; --bad:#ef7d73; --bad-soft:#3d2220;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --overlay:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--font-ui);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:26px 14px 18px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px}
.brand{padding:0 10px}
.brand .eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--fg-3)}
.brand h1{font-family:var(--font-display);font-size:19px;letter-spacing:.08em;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:none;text-align:left;padding:9px 12px;border-radius:8px;color:var(--fg-2);cursor:pointer;font-size:14px}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:500}
.badge{min-width:20px;padding:0 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12px;line-height:20px;text-align:center;font-weight:500}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--fg-3)}
.side-foot .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:0 9px;line-height:22px;border-radius:999px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fg-3)}
.sync.ok::before{background:var(--good)}
.sync.saving::before,.sync.connecting::before{background:var(--warn)}
.sync.error{background:var(--bad-soft);color:var(--bad)}
.sync.error::before{background:var(--bad)}
.sync.local{background:var(--accent-soft);color:var(--accent)}
.sync.local::before{background:var(--accent)}
.main{padding:30px 34px 72px;min-width:0}
.view{display:flex;flex-direction:column;gap:16px;max-width:1240px}
.tabbar{display:none}
.boot{max-width:420px;margin:12vh auto 0;text-align:center;color:var(--fg-2)}

/* type */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:4px}
.page-head h2{font-family:var(--font-display);font-size:25px;letter-spacing:.04em}
.eyebrow{font-size:12.5px;color:var(--fg-3);letter-spacing:.06em}
.sub{color:var(--fg-2);font-size:13px;margin-top:3px}
.lbl{font-size:12.5px;color:var(--fg-2);letter-spacing:.02em}
.hint{font-size:12.5px;color:var(--fg-3)}
.fine{font-size:12.5px;color:var(--fg-3)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums;color:var(--fg-3);font-size:12.5px;white-space:nowrap}
.strong{font-weight:600}
.muted{color:var(--fg-3)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.show-sm{display:none}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card h3{font-size:15px;font-weight:500}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.card.flush .card-head{padding:16px 20px 0}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:2px}
.tile-num{font-size:23px;font-weight:600;letter-spacing:.01em;margin-top:2px}
.tile-sub{font-size:12.5px;color:var(--fg-3);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.delta{font-weight:500}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.dash-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:16px}
.dash-top .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero{display:flex;flex-direction:column;gap:6px;justify-content:center}
.hero-num{font-size:46px;font-weight:600;line-height:1.15;letter-spacing:.01em}
.split{list-style:none;margin:6px 0 2px;padding:0;display:flex;flex-direction:column;gap:4px}
.split li{display:flex;align-items:center;gap:8px;color:var(--fg-2)}
.split li b{margin-left:auto;font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.split i,.pay i,.legend i,.dot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--dot,var(--fg-3));flex:none}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:10px;background:var(--accent-soft);color:var(--fg);font-size:13.5px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:0 9px;border-radius:999px;font-size:12px;line-height:22px;white-space:nowrap;background:var(--surface-2);color:var(--fg-2)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pay{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2);background:var(--surface-2);border-radius:999px;padding:0 9px;line-height:22px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pay i+span{margin-right:2px}
.tag{font-size:12px;color:var(--fg-2);border:1px solid var(--line-strong);border-radius:6px;padding:0 6px;white-space:nowrap}

/* buttons & fields */
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:8px;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;line-height:1.4}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:500}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:3px 10px;font-size:12.5px}
.btn.lg{padding:10px 22px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link-btn{border:0;background:none;padding:0;color:var(--fg-3);font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link-btn:hover{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--fg-2)}
input,select,textarea{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.bad{border-color:var(--bad)}
.form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.form-row .grow{flex:1 1 220px}
.form-row .w-qty{flex:0 0 84px}
.form-row .w-mid{flex:1 1 140px;max-width:200px}
.inline{display:flex;gap:8px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 13px;border-radius:7px;color:var(--fg-2);cursor:pointer;font-size:13.5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 20px}
.toolbar input[type=search]{max-width:260px}

/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--surface-2);color:var(--fg-2);font-weight:500;text-align:left;padding:9px 12px;white-space:nowrap;font-size:12.5px}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
td.zero{color:var(--fg-3)}
.nm{font-weight:500}
.meta{font-size:12.5px;color:var(--fg-3)}
.unit{font-weight:400;color:var(--fg-3);font-size:12px}
.per{display:block;font-size:12px;color:var(--fg-3);font-weight:400}
.empty{padding:28px 16px;text-align:center;color:var(--fg-3);font-size:13.5px}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.sale .who{font-weight:500}
.sale .time{font-variant-numeric:tabular-nums;color:var(--fg-3);font-size:12.5px;margin-right:8px}
.sale .items{font-size:13px;color:var(--fg-2);margin-top:1px}
.sale .amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sale .amt b{font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.sale .amt b.not-rev{color:var(--fg-3);font-weight:500}
.sale.svc .who::before{content:"核銷";font-size:11.5px;font-weight:500;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 5px;margin-right:6px}
.confirm-inline{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--bad);flex-wrap:wrap;justify-content:flex-end}

/* pos */
.pos{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.pos-form{display:flex;flex-direction:column;gap:18px}
.block{display:flex;flex-direction:column;gap:10px}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface-2);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel input,.panel select{background:var(--surface)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opt{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:9px 11px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.opt span{font-size:12.5px;color:var(--fg-2)}
.opt b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.opt small{font-size:11.5px;color:var(--fg-3)}
.opt[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.panel-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stock-note{font-size:12.5px;color:var(--fg-2)}
.stock-note b{font-variant-numeric:tabular-nums}
.cart{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px}
.cart li{display:grid;grid-template-columns:minmax(0,1fr) auto 100px 88px 30px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.cart li:last-child{border-bottom:0}
.cart .cart-head{padding:6px 12px;background:var(--surface-2);font-size:12px;color:var(--fg-2);border-radius:10px 10px 0 0}
.cart .q{font-variant-numeric:tabular-nums;color:var(--fg-2);font-size:13px;white-space:nowrap}
.cart .price-in{text-align:right;padding:4px 8px;font-variant-numeric:tabular-nums}
.cart .sub{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.cart-empty{padding:16px;border:1px dashed var(--line-strong);border-radius:10px;text-align:center;color:var(--fg-3);font-size:13.5px}
.x{border:0;background:none;color:var(--fg-3);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--surface-2);color:var(--bad)}
.cust-strip{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 14px;border:1px dashed var(--line-strong);border-radius:10px;font-size:13px}
.cust-strip .bal{display:flex;align-items:baseline;gap:6px}
.cust-strip .bal b{font-size:15px;font-variant-numeric:tabular-nums}
.cust-strip .pk{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px;background:var(--surface)}
.chip button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;font-weight:500}
.split-pay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end;background:var(--surface-2);border-radius:10px;padding:12px 14px}
.split-pay b{font-size:18px;font-variant-numeric:tabular-nums;line-height:38px}
.checkout{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line)}
.checkout .total{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin-left:8px}
.msg{font-size:13px;color:var(--bad);background:var(--bad-soft);padding:8px 12px;border-radius:8px}
.day-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.day-sum>div{background:var(--surface);padding:9px 12px;display:flex;flex-direction:column}
.day-sum b{font-size:16px;font-variant-numeric:tabular-nums;font-weight:600}
.day-sum .lbl{display:flex;align-items:center;gap:6px}
.day-nav{display:flex;align-items:center;gap:4px}

/* chart */
.chart{position:relative;min-height:230px}
.chart svg{display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-strong);stroke-width:1}
.chart .tick{fill:var(--fg-3);font-size:11px;font-family:var(--font-ui)}
.chart .hl{fill:var(--surface-2)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--fg-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:8px 11px;font-size:12.5px;box-shadow:var(--shadow);min-width:150px;z-index:2}
.tip .t{font-weight:500;margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:7px;color:var(--fg-2)}
.tip .r b{margin-left:auto;color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.tip .r.sum{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;color:var(--fg)}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--dot)}

/* report */
.pl{width:100%;border-collapse:collapse;font-size:14px}
.pl td{padding:7px 4px;border:0}
.pl tr.sec td{padding-top:14px;font-weight:500;color:var(--fg-2);font-size:12.5px;letter-spacing:.04em}
.pl tr.item td:first-child{padding-left:16px;color:var(--fg-2)}
.pl tr.total td{border-top:1px solid var(--line-strong);font-weight:600;padding-top:9px}
.pl tr.net td{border-top:2px solid var(--fg);font-weight:700;font-size:16px;padding-top:10px}
.pl .pct{color:var(--fg-3);font-size:12.5px;width:60px;text-align:right}
.pl tbody tr:hover td{background:none}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.bars li{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bars .track{height:10px;position:relative}
.bars .fill{position:absolute;inset:0 auto 0 0;background:var(--bar);border-radius:0 4px 4px 0;min-width:2px}
.bars .v{font-variant-numeric:tabular-nums;color:var(--fg-2);font-size:12.5px;white-space:nowrap}
.bars .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ratio{display:flex;gap:2px;height:14px;margin:6px 0 10px}
.ratio div{height:100%}
.ratio div:first-child{border-radius:4px 0 0 4px}
.ratio div:last-child{border-radius:0 4px 4px 0}
.ratio div:only-child{border-radius:4px}
.note{font-size:12.5px;color:var(--fg-2);background:var(--surface-2);border-radius:8px;padding:10px 12px}

/* course menu */
.plan-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.plan-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.plan-row:last-of-type{border-bottom:0}

    allWarehouses:clone(M.warehouses || DEFAULT_WH),
    products:vals(M.products, byOrd), courses:vals(M.courses || defaultCourses(), byOrd), plans:vals(M.plans || defaultPlans(), byOrd),
    customers:vals(M.customers, (a, b) => String(a.name).localeCompare(String(b.name), 'zh-Hant')),
    sales:[], services:[], moves:[], expenses:[], stocktakes:[], voids:[],
  };
  Object.keys(docs.ledger).sort().forEach(m => {
    const L = docs.ledger[m] || {};
    KINDS.forEach(k => { const mp = L[k] || {}; Object.keys(mp).forEach(id => { const r = mp[id]; if (!r) return; const rec = Object.assign(clone(r), {id}); if (r.void) S.voids.push({kind:k, rec}); else S[k].push(rec); }); });
  });
  S.warehouses = S.allWarehouses.filter(w => !w.archived);
  KINDS.forEach(k => S[k].sort(byTime));
  derive();
}
// 庫存、客人餘額、套票剩餘堂數都從紀錄算出來，不另外存
function derive() {
  S.courses.forEach(c => { if (c.costMode === 'items' && Array.isArray(c.costItems)) c.cost = round1(sum(c.costItems, itemCost)); });
  const P = {};
  S.products.forEach(p => { p.stock = {}; p.openQty = {}; p.openMoves = []; p.whLock = {}; p.touched = false; p.openOnly = true; S.allWarehouses.forEach(w => { p.stock[w.id] = 0; p.openQty[w.id] = 0; }); P[p.id] = p; });
  const add = (pid, wh, q, isOpen) => { const p = P[pid]; if (!p) return; p.stock[wh] = (p.stock[wh] || 0) + q; p.touched = true; if (!isOpen) { p.openOnly = false; p.whLock[wh] = true; } };
  S.moves.forEach(m => {
    if (m.type === 'transfer') { add(m.pid, m.wh, -m.qty); add(m.pid, m.to, m.qty); return; }
    add(m.pid, m.wh, moveDelta(m, m.wh), m.type === 'open');
    if (m.type === 'open' && P[m.pid]) { P[m.pid].openQty[m.wh] = (P[m.pid].openQty[m.wh] || 0) + m.qty; P[m.pid].openMoves.push({id:m.id, date:m.date, wh:m.wh}); }
  });
  S.sales.forEach(s => s.items.forEach(it => { if (it.kind === 'product') add(it.ref, it.wh, -it.qty); }));
  S.stocktakes.forEach(t => t.lines.forEach(l => { if (l.diff) add(l.pid, t.wh, l.diff); }));
  const CU = {}, PK = {};
  S.customers.forEach(c => {
    c.skinBal = c.skinOpen || 0; c.skinRate = c.skinOpenRate || 1; c.prodBal = c.prodOpen || 0; c.prodRate = c.prodOpenRate || 1;
    c.packages = (c.openPackages || []).map(p => ({id:p.id, course:p.course, total:p.total, used:p.preUsed || 0, date:p.date, value:p.value, sale:null}));
    c.packages.forEach(p => { PK[p.id] = p; }); CU[c.id] = c;
  });
  S.sales.forEach(s => {
    const c = CU[s.cust]; if (!c) return;
    s.items.forEach(it => {
      if (it.kind === 'stored') { if (it.plan === 'skin') { c.skinBal += it.amount; c.skinRate = it.rate || c.skinRate; } else { c.prodBal += it.amount; c.prodRate = it.rate || c.prodRate; } }
      if (it.pkg) { const p = {id:it.pkg, course:it.ref, total:it.sessions, used:0, date:s.date, value:it.amount / it.sessions, sale:s.id}; c.packages.push(p); PK[p.id] = p; }
    });
    c.skinBal -= s.skinUsed || 0; c.prodBal -= s.prodUsed || 0;
  });
  S.services.forEach(v => { const p = PK[v.pkg]; if (p) p.used += svq(v); });
  Object.values(PK).forEach(p => { p.left = p.total - p.used; });
}

/* ---------- 本地交易：同一次操作的多筆修改一併保存 ---------- */
function saveLocal() { /* 帳本由交易客戶端保存；離線模式使用加密 IndexedDB。 */ }
function commit(path, patch) {
  if (readOnly || !client || (!client.canWrite() && !batchScheduled)) { throw new Error('尚未連線或上一筆尚未保存，請先處理上方提示'); }
  const key = path.split('/')[1];
  if (path === 'master/main') docs.master = merge(docs.master || {}, patch);
  else docs.ledger[key] = merge(docs.ledger[key] || {}, patch);
  writeBatch.push({path,patch:clone(patch)}); rebuild();
  if (!batchScheduled) { batchScheduled = true; queueMicrotask(flushWrites); }
  return true;
}
async function flushWrites() {
  const changes = writeBatch; writeBatch = []; batchScheduled = false;
  if (!changes.length) return;
  try { const saved = await client.commit(changes); docs = clone(saved.docs); rebuild(); softRefresh(); toast('已保存到此展示分頁'); }
  catch (error) { showLanError(error); }
}
function writeLedger(kind, recs) {
  const byMonth = {};
  [].concat(recs).forEach(r => { const {id, ...rest} = r; const m = ym(r.date); (byMonth[m] || (byMonth[m] = {}))[id] = rest; });
  Object.keys(byMonth).forEach(m => commit('ledger/' + m, {[kind]:byMonth[m]}));
}

function voidLedger(kind, rec) { commit('ledger/' + ym(rec.date), {[kind]:{[rec.id]:{void:true, voidAt:today() + ' ' + nowTime()}}}); }
function writeMaster(kind, obj) {
  const M = docs.master || {}, rec = {};
  FIELDS[kind].forEach(f => { if (obj[f] !== undefined) rec[f] = clone(obj[f]); });
  const base = M[kind] ? {} : (kind === 'courses' ? defaultCourses() : kind === 'plans' ? defaultPlans() : {});
  base[obj.id] = rec;
  commit('master/main', {[kind]:base});
}

function dayStats(d) {
  const r = {cash:0, transfer:0, stored:0, count:0};
  S.sales.forEach(s => { if (s.date !== d) return; r.count++; r.cash += s.cash || 0; r.transfer += s.transfer || 0; r.stored += s.stored || 0; });
  r.services = sum(S.services.filter(v => v.date === d), svq);
  r.revenue = r.cash + r.transfer;
  return r;
}
function rangeRevenue(a, b) { return sum(S.sales.filter(s => s.date >= a && s.date <= b), s => (s.cash || 0) + (s.transfer || 0)); }
function monthStats(m) {
  const r = {cash:0, transfer:0, storedUse:0, rev:{course:0, pkg:0, product:0, stored:0, custom:0}, cogsProduct:0, cogsCourse:0, shrink:0, opexByCat:{}, count:0};
  S.sales.forEach(s => {
    if (ym(s.date) !== m) return;
    r.count++; r.cash += s.cash || 0; r.transfer += s.transfer || 0; r.storedUse += s.stored || 0;
    s.items.forEach(it => {
      if (isRev(s)) r.rev[it.kind === 'course' ? (it.pkg ? 'pkg' : 'course') : it.kind] += it.amount;
      if (it.kind === 'product') r.cogsProduct += it.cost; else r.cogsCourse += it.cost || 0;
    });
  });
  const svs = S.services.filter(v => ym(v.date) === m);
  r.serviceCount = sum(svs, svq);
  r.cogsCourse += sum(svs, v => v.cost);
  S.stocktakes.filter(t => ym(t.date) === m).forEach(t => t.lines.forEach(l => { const p = product(l.pid); if (p && p.type === 'retail') r.shrink += -l.diff * l.cost; }));
  S.expenses.filter(e => ym(e.date) === m).forEach(e => { r.opexByCat[e.cat] = (r.opexByCat[e.cat] || 0) + e.amount; });
  r.revenue = r.cash + r.transfer;
  r.cost = r.cogsProduct + r.cogsCourse + r.shrink;
  r.gross = r.revenue - r.cost;
  r.opex = sum(Object.values(r.opexByCat), x => x);
  r.net = r.gross - r.opex;
  return r;
}
function invValue() { return {cost:sum(S.products, p => totalStock(p) * p.cost), retail:sum(S.products.filter(p => p.type === 'retail'), p => totalStock(p) * p.price)}; }
function prepaid() {
  let bal = 0, pk = 0, sessions = 0;
  S.customers.forEach(c => { bal += c.skinBal + c.prodBal; c.packages.forEach(p => { pk += p.left * p.value; sessions += p.left; }); });
  return {bal, pk, sessions, total:bal + pk};
}
function allMonths() {
  const cur = ym(today()); let first = cur;
  S.sales.concat(S.expenses).forEach(x => { if (ym(x.date) < first) first = ym(x.date); });
  const out = []; for (let m = first; m <= cur; m = nextMonth(m)) out.unshift(m);

}

}
/* CARE-LOGIC-BEGIN */
function birthdayDistance(birthday, base) {
  const m = String(birthday || '').match(/(?:\d{4}-)?(\d{2})-(\d{2})$/);
  if (!m) return null;
  const now = new Date(base + 'T12:00:00');
  let next = new Date(now.getFullYear(), Number(m[1]) - 1, Number(m[2]), 12);
  if (next < now) next = new Date(now.getFullYear() + 1, Number(m[1]) - 1, Number(m[2]), 12);
  return Math.round((next - now) / 86400000);
}
function careReasons(c, base) {
  const reasons = [], kinds = [];
  const add = (kind, text) => { if (!kinds.includes(kind)) kinds.push(kind); reasons.push(text); };
  if (c.lastVisit) {
    const away = Math.floor((new Date(base + 'T12:00:00') - new Date(c.lastVisit + 'T12:00:00')) / 86400000);
    if (away >= 30) add('away', `${away} 天未回訪（上次 ${c.lastVisit}）`);
  }
  const birthdayIn = birthdayDistance(c.birthday, base);
  if (birthdayIn !== null && birthdayIn <= 30) add('birthday', birthdayIn === 0 ? '今天生日' : `${birthdayIn} 天後生日`);
  (c.packages || []).filter(p => p.left >= 1 && p.left <= 2).forEach(p => add('package', `${p.name || '套票'}剩 ${p.left} 堂`));
  const balances = [];
  if (c.skinBal > 0 && c.skinBal <= 1000) balances.push(`美膚儲值 ${Math.round(c.skinBal).toLocaleString()} 元`);
  if (c.prodBal > 0 && c.prodBal <= 1000) balances.push(`產品儲值 ${Math.round(c.prodBal).toLocaleString()} 元`);
  if (balances.length) add('balance', `${balances.join('、')}偏低`);
  return {reasons, kinds, birthdayIn};
}

function niceScale(max, n) {
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  return {step, top:Math.ceil(max / step) * step};
}
const topRound = (x, y, w, h, r) => { r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };

function drawDaily(host) {
  if (!host) return;
  const T = today(), days = [];
  for (let i = 29; i >= 0; i--) days.push({date:addDays(T, -i), cash:0, transfer:0, stored:0, count:0});
  const idx = Object.fromEntries(days.map((d, i) => [d.date, i]));
  S.sales.forEach(s => { const i = idx[s.date]; if (i === undefined) return; const d = days[i]; d.cash += s.cash || 0; d.transfer += s.transfer || 0; d.stored += s.stored || 0; d.count++; });
  const W = Math.max(280, host.clientWidth), H = 230, m = {t:10, r:6, b:26, l:42};
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const max = Math.max(1000, ...days.map(d => d.cash + d.transfer));
  const {step, top} = niceScale(max, 4);
  const y = v => m.t + ph - (v / top) * ph;
  const band = pw / days.length, bw = Math.min(18, Math.max(4, band * 0.62));
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="近 30 天每日實收，現金與匯款堆疊長條圖"><rect class="hl" x="0" y="${m.t}" width="${band}" height="${ph}" opacity="0"/>`;
  for (let v = 0; v <= top + 1e-6; v += step) s += `<line class="${v === 0 ? 'axis' : 'grid'}" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${wan(v)}</text>`;
  const every = band < 22 ? 5 : band < 34 ? 3 : 1;
  days.forEach((d, i) => {
    const cx = m.l + band * i + band / 2, x = cx - bw / 2, base = y(0);
    const yc = y(d.cash), yt = y(d.cash + d.transfer);
    if (d.cash > 0) s += `<path fill="var(--cash)" d="${d.transfer > 0 ? `M${x},${base}V${yc}H${x + bw}V${base}Z` : topRound(x, yc, bw, base - yc, 4)}"/>`;
    if (d.transfer > 0) { const y0 = d.cash > 0 ? yc - 2 : base; if (y0 - yt > 0.5) s += `<path fill="var(--transfer)" d="${topRound(x, yt, bw, y0 - yt, 4)}"/>`; }
    if ((days.length - 1 - i) % every === 0) s += `<text class="tick" x="${cx}" y="${H - 8}" text-anchor="middle">${fmtShort(d.date)}</text>`;
  });
  s += `</svg><div class="tip" hidden></div>`;
  host.innerHTML = s;
  const svg = host.querySelector('svg'), hl = host.querySelector('.hl'), tip = host.querySelector('.tip');
  const hide = () => { tip.hidden = true; hl.setAttribute('opacity', '0'); };
  svg.addEventListener('pointermove', e => {
    const rect = svg.getBoundingClientRect(), i = Math.floor((e.clientX - rect.left - m.l) / band);
    if (i < 0 || i >= days.length) return hide();
    const d = days[i];
    hl.setAttribute('x', m.l + band * i); hl.setAttribute('opacity', '1');
    tip.innerHTML = `<div class="t">${fmtDate(d.date)}</div>` + (d.count ? `
      <div class="r"><i style="--dot:var(--cash)"></i>現金<b>${money(d.cash)}</b></div>
      <div class="r"><i style="--dot:var(--transfer)"></i>匯款<b>${money(d.transfer)}</b></div>
      <div class="r sum">實收合計<b>${money(d.cash + d.transfer)}</b></div>
      ${d.stored ? `<div class="r">儲值扣款（不計入）<b>${money(d.stored)}</b></div>` : ''}` : `<div class="r">${weekday(d.date) === 1 ? '公休' : '沒有銷售'}</div>`);
    tip.hidden = false;
    const tw = tip.offsetWidth, cx = m.l + band * i + band / 2;
    tip.style.left = Math.max(0, cx + 14 + tw > W ? cx - 14 - tw : cx + 14) + 'px';
    tip.style.top = '8px';
  });
  svg.addEventListener('pointerleave', hide);
}

function setPay(p) {
  const prev = pos.pay; pos.pay = p; posMsg('');

    const before = pos.cart.length;

function storedSplit(cart) {
  let skin = 0, prod = 0;
  cart.forEach(l => { if (l.kind === 'product') prod += l.price * l.qty; else skin += l.price * l.qty; });
  return {skin, prod};
}
function validateCart() {
  if (!pos.cart.length) return '請先加入至少一個品項。';
  const c = posCust();
  if (pos.cart.some(l => l.kind === 'stored' || (l.kind === 'course' && (l.opt === 'p5' || l.opt === 'p10'))) && !c) return '套票和儲值要記在客人名下，請先選擇客人（或按「＋ 新客人」）。';
  if (pos.cart.some(l => !(l.price >= 0))) return '有品項的單價不是有效數字。';
  const need = {};
  pos.cart.filter(l => l.kind === 'product').forEach(l => { const k = l.ref + '|' + l.wh; need[k] = (need[k] || 0) + l.qty; });
  for (const k in need) {
    const [pid, wh] = k.split('|'), p = product(pid), have = p.stock[wh] || 0;
    if (need[k] > have) return `${p.name} 在「${whName(wh)}」只剩 ${have} ${p.unit}，不夠出貨 ${need[k]} ${p.unit}。可以改從其他倉庫出貨或先調撥。`;
  }
  if (pos.pay === 'split') {
    const cash = toNum(pos.splitCash), t = cartTotal();
    if (!(cash >= 0 && cash <= t)) return `請填現金收了多少（0 到 ${money(t)} 之間），其餘會算成匯款。`;
  }
  if (pos.pay === 'stored') {
    if (!c) return '儲值金扣款需要先選擇客人。';
    const {skin, prod} = storedSplit(pos.cart);
    if (skin > c.skinBal) return `美膚儲值餘額不足：這筆要扣 ${money(skin)}，${c.name}目前剩 ${money(c.skinBal)}。`;
    if (prod > c.prodBal) return `產品儲值餘額不足：這筆要扣 ${money(prod)}，${c.name}目前剩 ${money(c.prodBal)}。`;
  }
  return '';
}
function checkout() {
  const err = validateCart(); if (err) return posMsg(err);
  posMsg('');
  const sale = {id:uid('s'), date:pos.date, time:nowTime(), at:Date.now(), cust:pos.cust || null, cash:0, transfer:0, stored:0, items:[], total:0, note:pos.note.trim()};
  for (const l of pos.cart) {
    const amount = l.price * l.qty, it = {kind:l.kind, name:l.name, qty:l.qty, price:l.price, amount, cost:0};
    if (l.ref) it.ref = l.ref;
    if (l.kind === 'course') {
      const c = course(l.ref); it.opt = l.opt;
      if (l.opt === 'p5' || l.opt === 'p10') { it.sessions = (l.opt === 'p5' ? 5 : 10) * l.qty; it.pkg = uid('k'); }
      else it.cost = c.cost * l.qty;
    } else if (l.kind === 'product') { it.wh = l.wh; it.cost = product(l.ref).cost * l.qty; }
    else if (l.kind === 'stored') { const pl = plan(l.ref); it.plan = pl.kind; it.rate = pl.rate; }
    else it.cost = l.cost || 0;
    sale.items.push(it); sale.total += amount;
  }
  if (pos.pay === 'cash') sale.cash = sale.total;
  else if (pos.pay === 'transfer') sale.transfer = sale.total;
  else if (pos.pay === 'split') { sale.cash = toNum(pos.splitCash); sale.transfer = sale.total - sale.cash; }
  else { const {skin, prod} = storedSplit(pos.cart); sale.stored = sale.total; sale.skinUsed = skin; sale.prodUsed = prod; }
  writeLedger('sales', sale);
  const k = payKind(sale);
  const stockNotes = sale.items.filter(it => it.kind === 'product').map(it => { const p = product(it.ref); return `${p.name}：${whName(it.wh)}剩 ${p.stock[it.wh]} ${p.unit}`; });
  toast(`已記錄 ${money(sale.total)}（${k === 'split' ? `現金 ${money(sale.cash)}＋匯款 ${money(sale.transfer)}` : PAY[k]}）${stockNotes.length ? '。' + stockNotes.join('、') : ''}`, stockNotes.length ? 4200 : 2800);
  pos.cart = []; pos.note = ''; pos.splitCash = ''; $('#posNote').value = ''; $('#posSplitCash').value = '';
  renderNav(); renderPosCust(); renderPosPanel(); renderCart(); renderPosDay();
}
function voidSale(id) {

}

function openRedeem(cid, pkgId, date) {
  const c = customer(cid); if (!c) return;
  const pks = c.packages.filter(p => p.left > 0);
  if (!pks.length) return toast('這位客人沒有可以核銷的套票');
  const first = pks.find(p => p.id === pkgId) || pks[0];
  modal({title:`核銷套票・${esc(c.name)}`, submit:'核銷 1 堂', body:`
    <div class="form-grid">
      <div class="field span-2"><label for="rdPkg">套票</label><select id="rdPkg" name="pkg">${pks.map(p => `<option value="${p.id}" ${p.id === first.id ? 'selected' : ''}>${esc(courseName(p.course))}（剩 ${p.left} / ${p.total} 堂，${fmtShort(p.date)} 購買）</option>`).join('')}</select></div>
      <div class="field"><label for="rdQty">核銷堂數</label>
        <div class="stepper"><button type="button" class="btn" data-step="-1" aria-label="少一堂">−</button><input id="rdQty" name="qty" inputmode="numeric" value="1"><button type="button" class="btn" data-step="1" aria-label="多一堂">＋</button></div>
      </div>
      <div class="field"><label for="rdDate">日期</label><input type="date" id="rdDate" name="date" value="${date || today()}"></div>
      <div class="field span-2"><label for="rdNote">備註</label><input id="rdNote" name="note" placeholder="選填，例如：美容師 Amy"></div>
    </div>
    <p class="hint" id="rdHint" style="margin-top:10px"></p>`,
    onOpen:(f, form) => {
      const btn = form.querySelector('button[type=submit]');
      const cur = () => c.packages.find(p => p.id === f.pkg.value);
      const sync = clamp => {
        const pk = cur(); let q = Math.floor(toNum(f.qty.value));
        if (clamp || !(q >= 1)) { q = Math.min(Math.max(q >= 1 ? q : 1, 1), pk.left); f.qty.value = q; }
        const ok = q >= 1 && q <= pk.left, each = (course(pk.course) || {cost:0}).cost;
        btn.textContent = ok ? `核銷 ${q} 堂` : '核銷';
        $('#rdHint').textContent = ok
          ? `這組剩 ${pk.left} 堂，核銷後剩 ${pk.left - q} 堂。核銷不產生營收（買套票當天已計入），會記 ${q} 堂的耗材成本 ${fmtCost(each * q)}。`
          : `這組最多只能核銷 ${pk.left} 堂。`;
      };
      form.addEventListener('click', e => { const b = e.target.closest('[data-step]'); if (!b) return; f.qty.value = (Math.floor(toNum(f.qty.value)) || 0) + Number(b.dataset.step); sync(true); });
      f.qty.addEventListener('input', () => sync(false));
      f.qty.addEventListener('blur', () => sync(true));
      f.pkg.addEventListener('change', () => sync(true));
      sync(true);
    },
    onSubmit:f => {
      const pk = c.packages.find(p => p.id === f.pkg.value), q = toNum(f.qty.value);
      if (!f.date.value) return '請選擇日期。';
      if (!pk || pk.left < 1) return '這組套票已經用完了。';
      if (!Number.isInteger(q) || q < 1) return '核銷堂數要是 1 以上的整數。';
      if (q > pk.left) return `這組只剩 ${pk.left} 堂，不能核銷 ${q} 堂。`;
      const each = (course(pk.course) || {cost:0}).cost;
      writeLedger('services', {id:uid('v'), date:f.date.value, at:Date.now(), cust:c.id, pkg:pk.id, course:pk.course, qty:q, cost:round1(each * q), note:f.note.value.trim()});
      toast(`已核銷 ${courseName(pk.course)} ${q} 堂，剩 ${pk.left - q} 堂`);
      if (view === 'pos') { renderPosCust(); renderPosDay(); } else renderView();
    }});
}

function renderBulk() {
  const el = $('#view-inventory');
  const actions = `<button type="button" class="btn" data-badd>＋ 新增一列</button><button type="button" class="btn ghost" data-bcancel>取消</button><button type="button" class="btn primary" data-bsave>儲存全部</button>`;
  el.innerHTML = `
  <header class="page-head">

    if (t.dataset.badd !== undefined) {
      inv.rows.push({id:uid('p'), sku:'', name:'', type:'retail', unit:'瓶', cost:'', price:'', safety:'2', isNew:true, lock:false, whLock:{}, open:Object.fromEntries(S.warehouses.map(w => [w.id, '']))});
      inv.dirty = true; renderBulk();

    } else if (t.dataset.bcancel !== undefined) {
      const leave = () => { inv.edit = false; inv.rows = null; inv.dirty = false; RENDER.inventory(); };
      if (inv.dirty) confirmBox('放棄這次批次編輯的修改？', leave, '放棄修改'); else leave();
    } else if (t.dataset.bsave !== undefined) saveBulk();
  };
  el.oninput = e => {
    const t = e.target; if (t.dataset.r === undefined) return;
    const r = inv.rows[Number(t.dataset.r)], k = t.dataset.k;
    if (k.startsWith('open.')) r.open[k.slice(5)] = t.value; else r[k] = t.value;
    inv.dirty = true;
  };
  el.onchange = e => { const t = e.target; if (t.dataset.k === 'type') { inv.rows[Number(t.dataset.r)].type = t.value; inv.dirty = true; } };
}
function saveBulk() {
  const msg = $('#bxMsg');
  const fail = t => { msg.textContent = t; msg.hidden = false; msg.scrollIntoView({block:'center'}); };
  const T = today(), prodPatch = {}, movePatch = {};
  const addMove = (m, id, rec) => { (movePatch[m] || (movePatch[m] = {}))[id] = rec; };
  const blank = v => String(v ?? '').trim() === '';
  let saved = 0, ord = 0;
  for (const r of inv.rows) {
    if (r.isNew && [r.sku, r.name, r.cost, r.price].every(blank) && S.warehouses.every(w => blank(r.open[w.id]))) continue;
    const name = r.name.trim();
    if (!name) return fail('有一列還沒填品名。');
    const cost = blank(r.cost) ? 0 : toNum(r.cost), price = blank(r.price) ? 0 : toNum(r.price), safety = blank(r.safety) ? 0 : toNum(r.safety);
    if (!(cost >= 0)) return fail(`「${name}」的成本不是有效數字。`);
    if (!(price >= 0)) return fail(`「${name}」的售價不是有效數字。`);
    if (!(safety >= 0) || !Number.isInteger(safety)) return fail(`「${name}」的安全量要是 0 以上的整數。`);
    prodPatch[r.id] = {ord:ord++, sku:r.sku.trim() || '—', name, type:r.type, unit:r.unit.trim() || '個', cost, price, safety};
    saved++;
    const p = r.isNew ? null : product(r.id);
    for (const w of S.warehouses) {
      if (r.whLock[w.id]) continue;
      const q = blank(r.open[w.id]) ? 0 : toNum(r.open[w.id]);
      if (!(q >= 0) || !Number.isInteger(q)) return fail(`「${name}」在${w.name}的期初數量要是 0 以上的整數。`);
      const old = p ? (p.openQty[w.id] || 0) : 0;
      if (q === old) continue;
      if (p) p.openMoves.filter(m => m.wh === w.id).forEach(m => addMove(ym(m.date), m.id, null));
      if (q > 0) addMove(ym(T), uid('m'), {date:T, at:Date.now(), type:'open', pid:r.id, wh:w.id, qty:q, note:'期初庫存'});
    }
  }
  inv.deleted.forEach(id => { prodPatch[id] = null; const p = product(id); if (p) p.openMoves.forEach(m => addMove(ym(m.date), m.id, null)); });
  commit('master/main', {products:prodPatch});
  Object.keys(movePatch).forEach(m => commit('ledger/' + m, {moves:movePatch[m]}));
  inv.edit = false; inv.rows = null; inv.dirty = false;
  toast(`已送出 ${saved} 項商品修改${inv.deleted.length ? `，刪除 ${inv.deleted.length} 項` : ''}`);
  refresh();
}

/* ---------- 倉庫管理 ---------- */
function openWarehouses() {
  const rows = S.allWarehouses.map(w => ({id:w.id, name:w.name, archived:!!w.archived, del:false, isNew:false}));
  const stockOf = id => ({qty:sum(S.products, p => p.stock[id] || 0), cost:sum(S.products, p => (p.stock[id] || 0) * p.cost)});
  const used = id => S.moves.concat(S.voids.filter(v => v.kind === 'moves').map(v => v.rec)).some(m => m.wh === id || m.to === id)
    || S.sales.concat(S.voids.filter(v => v.kind === 'sales').map(v => v.rec)).some(x => x.items.some(it => it.wh === id))
    || S.stocktakes.some(t => t.wh === id);
  const body = () => `
    <ul class="wh-list">${rows.map((r, i) => r.archived ? '' : `<li class="wh-row${r.del ? ' del' : ''}">
      <input data-wi="${i}" value="${esc(r.name)}" placeholder="倉庫名稱" aria-label="倉庫名稱" ${r.del ? 'disabled' : ''}>
      <span class="meta">${r.isNew ? '新倉庫' : r.del ? '儲存後刪除' : (st => `${num(st.qty)} 件・${money(st.cost)}`)(stockOf(r.id))}</span>
      ${r.del ? `<button type="button" class="btn sm" data-wundo="${i}">復原</button>` : `<button type="button" class="btn sm ghost" data-wdel="${i}">刪除</button>`}
    </li>`).join('')}</ul>
    <button type="button" class="btn sm" data-wadd style="margin-top:10px">＋ 新增倉庫</button>
    ${rows.some(r => r.archived) ? `<div class="note" style="margin-top:14px">已刪除的倉庫：${rows.map((r, i) => r.archived ? `${esc(r.name)} <button type="button" class="link" data-wrestore="${i}">恢復</button>` : '').filter(Boolean).join('　')}</div>` : ''}
    <p class="hint" style="margin-top:12px">刪除前要先把那個倉庫的庫存調撥到其他倉庫。刪除後，過去的紀錄還是會顯示原本的倉庫名稱，之後也可以恢復。新倉庫的期初數量可以在「批次編輯」填。</p>`;
  modal({title:'倉庫管理', submit:'儲存', body:'<div id="whBody"></div>',
    onOpen:(f, form) => {
      const box = form.querySelector('#whBody'), msg = form.querySelector('.msg');
      const say = t => { msg.textContent = t; msg.hidden = !t; };
      const draw = () => { box.innerHTML = body(); };
      draw();
      box.addEventListener('input', e => { const i = e.target.dataset.wi; if (i !== undefined) rows[Number(i)].name = e.target.value; });
      box.addEventListener('click', e => {
        const t = e.target.closest('button'); if (!t) return;
        const ds = t.dataset; say('');
        if (ds.wadd !== undefined) {
          rows.push({id:uid('w'), name:'', archived:false, del:false, isNew:true}); draw();
          const ins = box.querySelectorAll('[data-wi]'); ins[ins.length - 1].focus();
        } else if (ds.wdel !== undefined) {
          const r = rows[Number(ds.wdel)];
          if (r.isNew) { rows.splice(Number(ds.wdel), 1); draw(); return; }
          const st = stockOf(r.id);
          if (st.qty !== 0) return say(`「${r.name}」還有 ${num(st.qty)} 件庫存，請先到庫存頁用「調撥」移到其他倉庫，再刪除。`);
          if (rows.filter(x => !x.archived && !x.del).length <= 1) return say('至少要保留一個倉庫。');
          r.del = true; draw();
        } else if (ds.wundo !== undefined) { rows[Number(ds.wundo)].del = false; draw(); }
        else if (ds.wrestore !== undefined) { rows[Number(ds.wrestore)].archived = false; draw(); }
      });
    },
    onSubmit:() => {
      const active = rows.filter(r => !r.archived && !r.del);
      if (active.some(r => !r.name.trim())) return '倉庫名稱不能空白。';
      const names = active.map(r => r.name.trim());
      if (new Set(names).size !== names.length) return '有兩個倉庫名稱一樣，請改成不同的名字。';
      const next = [];
      rows.forEach(r => {
        const name = r.name.trim() || r.name;
        if (r.del && !used(r.id)) return;                 // 從沒用過的倉庫直接移除
        next.push(r.del || r.archived ? {id:r.id, name, archived:true} : {id:r.id, name});
      });
      commit('master/main', {warehouses:next});
      toast('已更新倉庫'); refresh();
    }});
}

/* ---------- 盤點（在庫存頁切換到「盤點」） ---------- */
const st = {wh:'w2', date:today(), counts:{}, type:'all'};
const stRows = () => S.products.filter(p => st.type === 'all' || p.type === st.type);
function stDiffCells(p) {
  const sys = p.stock[st.wh] || 0, a = st.counts[p.id];
  if (a === undefined) return ['<span class="muted">—</span>', '<span class="muted">—</span>'];
  const d = a - sys;
  return [d === 0 ? '<span class="pill good">相符</span>' : `<span class="pill ${d < 0 ? 'bad' : 'warn'}">${d > 0 ? '盤盈 +' : '盤虧 '}${d}</span>`, money(d * p.cost)];
}
function renderStBody() {
  const rows = stRows();
  $('#stBody').innerHTML = rows.length ? rows.map(p => {
    const [dc, vc] = stDiffCells(p), a = st.counts[p.id];
    return `<tr data-row="${p.id}"><td class="mono hide-sm">${esc(p.sku)}</td><td class="c-head"><div class="nm">${esc(p.name)}</div><div class="meta">${p.type === 'retail' ? '販售品' : '院用耗材'}・${esc(p.unit)}</div></td>
      ${td('系統數量', p.stock[st.wh] || 0, 'num')}
      <td class="num" data-label="實盤數量"><input class="count" data-pid="${p.id}" inputmode="numeric" value="${a === undefined ? '' : a}" style="width:90px;text-align:right" aria-label="${esc(p.name)} 實盤數量"></td>
      <td class="num" data-label="差異" data-dc>${dc}</td><td class="num" data-label="差異金額" data-vc>${vc}</td></tr>`;
  }).join('') : '<tr><td colspan="6" class="empty">沒有品項</td></tr>';
  updateStSum();
}
function updateStRow(pid) {
  const row = document.querySelector(`[data-row="${pid}"]`); if (!row) return;
  const [dc, vc] = stDiffCells(product(pid));
  row.querySelector('[data-dc]').innerHTML = dc; row.querySelector('[data-vc]').innerHTML = vc;
}
function updateStSum() {
  const rows = stRows(), counted = rows.filter(p => st.counts[p.id] !== undefined);
  let gain = 0, loss = 0;
  counted.forEach(p => { const d = st.counts[p.id] - (p.stock[st.wh] || 0); if (d > 0) gain += d * p.cost; else loss += -d * p.cost; });
  $('#stSum').innerHTML = `已盤 <b>${counted.length}</b> / ${rows.length} 項　盤盈 <b>${money(gain)}</b>　盤虧 <b>${money(-loss)}</b>`;
}
function commitStocktake() {
  const counted = S.products.filter(p => st.counts[p.id] !== undefined);
  if (!counted.length) return toast('還沒有輸入任何實盤數量');
  const lines = counted.map(p => { const sys = p.stock[st.wh] || 0, actual = st.counts[p.id]; return {pid:p.id, sys, actual, diff:actual - sys, cost:p.cost}; });
  const diffs = lines.filter(l => l.diff !== 0);
  confirmBox(`確認「${esc(whName(st.wh))}」的盤點結果？共盤 ${lines.length} 項，其中 ${diffs.length} 項有差異。確認後這些品項的系統庫存會改成實盤數量。`, () => {
    writeLedger('stocktakes', {id:uid('t'), date:st.date, at:Date.now(), wh:st.wh, lines});
    st.counts = {};
    toast(diffs.length ? `盤點完成，已調整 ${diffs.length} 項庫存` : '盤點完成，帳實相符');
    refresh();
  }, '確認並調整');
}

function updateCostCalc() {

  }).join('');

function saveCourse() {
  const isNew = ce.sel === NEW_COURSE, c = isNew ? null : course(ce.sel), d = ce.draft, msg = $('#ceMsg');
  const fail = t => { msg.textContent = t; msg.hidden = false; msg.scrollIntoView({block:'nearest'}); };
  const name = d.name.trim();
  if (!name) return fail('請填療程名稱。');
  const prices = {};
  for (const [k, l] of PRICE_KEYS) { const v = String(d[k]).trim() === '' ? NaN : toNum(d[k]); if (!(v >= 0)) return fail(`請填有效的${l}。`); prices[k] = v; }
  if (d.mode === 'manual') { if (!(toNum(d.cost) >= 0)) return fail('請填 0 以上的每堂成本。'); }
  else for (const it of d.items) {
    if (it.type === 'stock') {
      if (!product(it.pid)) return fail('有一列院用耗材還沒選品項。');
      if (!(toNum(it.uses) > 0)) return fail(`「${product(it.pid).name}」請填大約可以做幾次（要大於 0）。`);
    } else {
      if (!String(it.name || '').trim()) return fail('有一列成本項目還沒填名稱。');
      if (!(toNum(it.amount) >= 0)) return fail(`「${it.name}」請填 0 以上的每堂金額。`);
    }
  }
  const cost = draftCost(d);
  const items = d.mode === 'items' ? d.items.map(it => it.type === 'stock' ? {type:'stock', pid:it.pid, uses:toNum(it.uses)} : {type:'custom', name:String(it.name).trim(), amount:toNum(it.amount)}) : clone(c ? c.costItems || [] : []);
  const rec = Object.assign(isNew ? {id:uid('c'), ord:S.courses.length ? Math.max(...S.courses.map(x => x.ord || 0)) + 1 : 0} : Object.assign({}, c),
    {name, series:d.series.trim() || '其他', dur:d.dur.trim(), costMode:d.mode, costItems:items, cost}, prices);
  writeMaster('courses', rec);
  const costChanged = !isNew && Math.abs((c.cost || 0) - cost) > 0.001;
  const n = costChanged && ce.apply ? applyCostToMonth(rec.id, cost, ym(today())) : 0;
  ce.sel = rec.id; ce.draft = null; ce.dirty = false;
  toast(isNew ? `已新增療程：${name}` : `已儲存：${name}${n ? `，本月 ${n} 堂成本已一起更新` : ''}`);
  refresh();
}
// 把本月已記錄的單堂／體驗價與套票核銷改用新成本（一次寫入這個月的帳）
function applyCostToMonth(cid, cost, m) {
  const sales = {}, services = {}; let n = 0;
  S.sales.filter(s => ym(s.date) === m).forEach(s => {
    let hit = false;
    const items = s.items.map(it => { if (it.kind === 'course' && it.ref === cid && !it.pkg) { hit = true; n += it.qty; return Object.assign({}, it, {cost:round1(cost * it.qty)}); } return it; });
    if (hit) sales[s.id] = {items};
  });
  S.services.filter(v => ym(v.date) === m && v.course === cid).forEach(v => { services[v.id] = {cost:round1(cost * svq(v))}; n += svq(v); });
  const patch = {};
  if (Object.keys(sales).length) patch.sales = sales;
  if (Object.keys(services).length) patch.services = services;
  if (n) commit('ledger/' + m, patch);
  return n;
}

  S.sales.filter(s => s.cust === cid).forEach(s => ev.push({s, html:`${td('日期', s.date, 'mono')}<td class="c-head" data-label="內容">${itemsText(s)}</td>${td('收款', payPill(s))}${td('金額', money(s.total), 'num')}`}));
  S.services.filter(v => v.cust === cid).forEach(v => ev.push({s:v, html:`${td('日期', v.date, 'mono')}<td class="c-head" data-label="內容">套票核銷・${esc(courseName(v.course))}${svq(v) > 1 ? ` ×${svq(v)} 堂` : ''}</td>${td('收款', '<span class="pill">核銷</span>')}${td('金額', '—', 'num muted')}`}));
  ev.sort((a, b) => byTime(b.s, a.s));
  const contacts = [['電話', c.phone], ['LINE', c.line], ['其他聯絡', c.contact], ['生日', c.birthday ? fmtBday(c.birthday) : ''], ['地址', c.address]].filter(x => x[1]);
  modal({title:`${esc(c.name)}・資料與紀錄`, wide:true, body:`
    <div class="contact-card">
      ${contacts.length ? `<dl>${contacts.map(([k, v]) => `<div><dt>${k}</dt><dd><span>${esc(v)}</span>${k !== '生日' ? `<button type="button" class="link" data-copy="${esc(v)}">複製</button>` : ''}</dd></div>`).join('')}</dl>` : '<p class="hint">還沒有聯絡資料。</p>'}
      <button type="button" class="btn sm" data-cedit2="${c.id}">編輯資料</button>
    </div>
    <div class="cust-strip" style="margin-bottom:14px">
      <div class="bal"><span class="lbl">美膚儲值</span><b>${money(c.skinBal)}</b>${c.skinBal ? `<span class="pill">${zhe(c.skinRate)}</span>` : ''}</div>
      <div class="bal"><span class="lbl">產品儲值</span><b>${money(c.prodBal)}</b>${c.prodBal ? `<span class="pill">${zhe(c.prodRate)}</span>` : ''}</div>
      <div class="bal"><span class="lbl">累計實收</span><b>${money(sum(S.sales.filter(s => s.cust === cid), s => (s.cash || 0) + (s.transfer || 0)))}</b></div>
    </div>

    <h4 style="font-size:13.5px;font-weight:500;margin-bottom:6px">來店紀錄</h4>
    ${ev.length ? `<div class="tbl-wrap"><table class="cards"><thead><tr><th>日期</th><th>內容</th><th>收款</th><th class="num">金額</th></tr></thead><tbody>${ev.map(x => `<tr>${x.html}</tr>`).join('')}</tbody></table></div>` : '<p class="empty">還沒有紀錄</p>'}`,

/* ---------- 歷史查詢 ---------- */
const hs = {tab:'log', from:null, to:null, type:'all', q:'', showVoid:true, days:31, stockDate:null, stockQ:''};
const HTYPE = {sale:'銷售', svc:'套票核銷', move:'庫存進出', stocktake:'盤點', exp:'支出'};
function histPreset(k) {
  const T = today(), M = ym(T), PM = prevMonth(M);
  return {today:[T, T], yesterday:[addDays(T, -1), addDays(T, -1)], d7:[addDays(T, -6), T], month:[M + '-01', T], last:[PM + '-01', PM + '-' + pad(daysIn(PM))]}[k];
}
function histEvents() {
  const ev = [], from = hs.from, to = hs.to, inR = d => d >= from && d <= to;
  const push = (kind, rec, voided) => { if (inR(rec.date)) ev.push({kind, rec, voided:!!voided, date:rec.date, time:rec.time || '', at:rec.at || 0}); };
  const map = {sales:'sale', services:'svc', moves:'move', stocktakes:'stocktake', expenses:'exp'};
  S.sales.forEach(r => push('sale', r)); S.services.forEach(r => push('svc', r)); S.moves.forEach(r => push('move', r));
  S.stocktakes.forEach(r => push('stocktake', r)); S.expenses.forEach(r => push('exp', r));
  if (hs.showVoid) S.voids.forEach(v => push(map[v.kind], v.rec, true));
  const q = hs.q.trim().toLowerCase();
  return ev.filter(e => {
    if (hs.type !== 'all') {
      if (hs.type === 'stock') { if (!(e.kind === 'move' || e.kind === 'stocktake' || (e.kind === 'sale' && e.rec.items.some(it => it.kind === 'product')))) return false; }
      else if (e.kind !== hs.type) return false;
    }
    return !q || evText(e).toLowerCase().includes(q);
  }).sort((a, b) => b.date.localeCompare(a.date) || b.time.localeCompare(a.time) || b.at - a.at);
}
function evText(e) {
  const r = e.rec;
  if (e.kind === 'sale') return [custName(r.cust), r.note, ...r.items.map(it => it.name)].join(' ');
  if (e.kind === 'svc') return [custName(r.cust), courseName(r.course), r.note].join(' ');
  if (e.kind === 'move') return [(product(r.pid) || {}).name, (product(r.pid) || {}).sku, MOVE[r.type], r.note, whName(r.wh), r.to ? whName(r.to) : ''].join(' ');
  if (e.kind === 'stocktake') return ['盤點', whName(r.wh), ...r.lines.map(l => (product(l.pid) || {}).name)].join(' ');
  return [r.cat, r.note].join(' ');
}
function evRow(e) {
  const r = e.rec, vtag = e.voided ? `<span class="pill bad">已作廢${r.voidAt ? ' ' + esc(r.voidAt.slice(5)) : ''}</span>` : '';
  let tag = HTYPE[e.kind], desc = '', amt = '';
  if (e.kind === 'sale') { desc = `<b>${esc(custName(r.cust))}</b>　${itemsText(r)}${r.note ? `<div class="meta">備註：${esc(r.note)}</div>` : ''}`; amt = `<b class="${isRev(r) ? '' : 'not-rev'}">${money(r.total)}</b>${payPill(r)}`; }
  else if (e.kind === 'svc') { const cu = customer(r.cust); desc = `<b>${esc(cu ? cu.name : '')}</b>　${esc(courseName(r.course))}${svq(r) > 1 ? ` ×${svq(r)} 堂` : ''}${r.note ? `・${esc(r.note)}` : ''}`; amt = '<span class="hint">不計營收</span>'; }
  else if (e.kind === 'move') {
    const p = product(r.pid); tag = MOVE[r.type];
    const where = r.type === 'transfer' ? `${esc(whName(r.wh))} → ${esc(whName(r.to))}` : esc(whName(r.wh));
    desc = `<b>${esc(p ? p.name : '（已刪除的商品）')}</b>　${where}${r.note ? `・${esc(r.note)}` : ''}`;
    amt = `<b>${r.type === 'use' ? '−' : r.type === 'transfer' ? '' : '+'}${r.qty} ${esc(p ? p.unit : '')}</b>${r.type === 'in' && r.cost ? `<span class="hint">單位成本 ${money(r.cost)}</span>` : ''}`;
  } else if (e.kind === 'stocktake') {
    const diffs = r.lines.filter(l => l.diff);
    desc = `<b>${esc(whName(r.wh))}</b>　盤 ${r.lines.length} 項，${diffs.length} 項有差異${diffs.length ? '：' + diffs.map(l => `${esc((product(l.pid) || {}).name || '')} ${l.diff > 0 ? '+' : ''}${l.diff}`).join('、') : ''}`;
    amt = `<b>${money(sum(diffs, l => l.diff * l.cost))}</b>`;
  } else { desc = `<b>${esc(r.cat)}</b>　${esc(r.note || '')}`; amt = `<b>${money(r.amount)}</b>${payTag(r.pay)}`; }
  return `<li class="ev${e.voided ? ' voided' : ''}"><div class="ev-meta"><span class="time">${esc(e.time || '—')}</span><span class="ev-tag ${e.kind}">${tag}</span></div><div class="desc">${desc}${vtag ? `<div>${vtag}</div>` : ''}</div><div class="amt">${amt}</div></li>`;
}
RENDER.history = function () {
  const el = $('#view-history');
  if (!hs.from) [hs.from, hs.to] = histPreset('d7');
  if (!hs.stockDate) hs.stockDate = today();
  el.innerHTML = `
  <header class="page-head">
    <div><h2>歷史查詢</h2><p class="sub">每一筆紀錄都會一直保留，作廢的也看得到。可以依日期、類型、關鍵字找過去的紀錄，也能看某一天結束時的庫存。</p></div>
    <div class="seg" id="hsTab"><button type="button" data-htab="log" aria-pressed="${hs.tab === 'log'}">每日紀錄</button><button type="button" data-htab="stock" aria-pressed="${hs.tab === 'stock'}">某日庫存</button></div>
  </header>
  <div id="hsBody"></div>`;
  renderHistBody();
  el.onclick = e => {
    const t = e.target.closest('button'); if (!t) return;
    const ds = t.dataset;
    if (ds.htab) { hs.tab = ds.htab; el.querySelectorAll('#hsTab button').forEach(b => b.setAttribute('aria-pressed', b === t)); renderHistBody(); }
    else if (ds.preset) { [hs.from, hs.to] = histPreset(ds.preset); hs.days = 31; renderHistBody(); }
    else if (ds.more !== undefined) { hs.days += 31; renderHistLog(); }
    else if (ds.sday) { hs.stockDate = addDays(hs.stockDate, Number(ds.sday)); renderHistBody(); }
    else if (ds.dayLog) { hs.tab = 'log'; hs.from = hs.to = ds.dayLog; hs.type = 'stock'; el.querySelectorAll('#hsTab button').forEach(b => b.setAttribute('aria-pressed', b.dataset.htab === 'log')); renderHistBody(); }
    else if (t.id === 'hsExport') exportHistory();
  };
  el.onchange = e => {
    const t = e.target;
    if (t.id === 'hsFrom' && t.value) { hs.from = t.value; if (hs.to < hs.from) hs.to = hs.from; hs.days = 31; renderHistBody(); }
    else if (t.id === 'hsTo' && t.value) { hs.to = t.value; if (hs.from > hs.to) hs.from = hs.to; hs.days = 31; renderHistBody(); }
    else if (t.id === 'hsType') { hs.type = t.value; renderHistLog(); }
    else if (t.id === 'hsVoid') { hs.showVoid = t.checked; renderHistLog(); }
    else if (t.id === 'hsDate' && t.value) { hs.stockDate = t.value; renderHistBody(); }
  };
  el.oninput = e => {
    if (e.target.id === 'hsQ') { hs.q = e.target.value; renderHistLog(); }
    else if (e.target.id === 'hsSQ') { hs.stockQ = e.target.value; renderHistStockTable(); }
  };
};
function renderHistBody() {
  const box = $('#hsBody');
  if (hs.tab === 'log') {
    box.innerHTML = `
    <div class="card">
      <div class="filters">
        <div class="field"><label for="hsFrom">從</label><input type="date" id="hsFrom" value="${hs.from}"></div>
        <div class="field"><label for="hsTo">到</label><input type="date" id="hsTo" value="${hs.to}"></div>
        <div class="field"><label for="hsType">類型</label><select id="hsType">${[['all','全部'],['sale','銷售'],['svc','套票核銷'],['stock','庫存進出'],['exp','支出']].map(([k, l]) => `<option value="${k}" ${hs.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="field grow"><label for="hsQ">關鍵字</label><input id="hsQ" type="search" value="${esc(hs.q)}" placeholder="客人、品項、備註"></div>
      </div>
      <div class="filters" style="margin-top:12px;justify-content:space-between">
        <div class="seg">${[['today','今天'],['yesterday','昨天'],['d7','近 7 天'],['month','本月'],['last','上月']].map(([k, l]) => { const [a, b] = histPreset(k); return `<button type="button" data-preset="${k}" aria-pressed="${hs.from === a && hs.to === b}">${l}</button>`; }).join('')}</div>
        <div class="actions" style="align-items:center"><label class="check" style="align-items:center"><input type="checkbox" id="hsVoid" ${hs.showVoid ? 'checked' : ''}>顯示已作廢</label><button type="button" class="btn" id="hsExport">匯出 CSV</button></div>
      </div>
    </div>
    <div class="tiles" id="hsTiles"></div>
    <div class="card" id="hsLog"></div>`;
    renderHistLog();
  } else {
    const D = hs.stockDate;
    box.innerHTML = `
    <div class="card">
      <div class="filters" style="justify-content:space-between">
        <div class="filters">
          <div class="field"><label for="hsDate">日期</label><input type="date" id="hsDate" value="${D}" max="${today()}"></div>
          <div class="day-nav" style="padding-bottom:4px"><button type="button" class="btn sm ghost" data-sday="-1">‹ 前一天</button><button type="button" class="btn sm ghost" data-sday="1" ${D >= today() ? 'disabled' : ''}>後一天 ›</button></div>
        </div>
        <div class="field grow" style="max-width:280px"><label for="hsSQ">搜尋品項</label><input id="hsSQ" type="search" value="${esc(hs.stockQ)}" placeholder="品名或品號"></div>
      </div>
      <p class="hint" style="margin-top:10px">以 ${fmtDate(D)} 營業結束時的數量計算。綠字／紅字是當天的增減。</p>
    </div>
    <div class="tiles" id="hsSTiles"></div>
    <div class="card flush">
      <div class="card-head"><h3>${fmtDate(D)}的庫存</h3><div class="actions"><button type="button" class="btn sm" data-day-log="${D}">看當天進出明細</button><button type="button" class="btn sm" id="hsExport">匯出 CSV</button></div></div>
      <div class="tbl-wrap"><table class="cards">
        <thead><tr><th>品號</th><th>品名</th>${histWhs().map(w => `<th class="num">${esc(whName(w.id))}</th>`).join('')}<th class="num">合計</th><th class="num">當天增減</th><th class="num">庫存成本</th></tr></thead>
        <tbody id="hsSBody"></tbody>
      </table></div>
    </div>`;
    renderHistStockTable();
  }
}
function renderHistLog() {
  const evs = histEvents();
  const days = [...new Set(evs.map(e => e.date))];
  const live = evs.filter(e => !e.voided);
  const rev = sum(live.filter(e => e.kind === 'sale'), e => (e.rec.cash || 0) + (e.rec.transfer || 0));
  const cash = sum(live.filter(e => e.kind === 'sale'), e => e.rec.cash || 0);
  $('#hsTiles').innerHTML = [
    tile('實收合計', money(rev), `<span>現金 ${money(cash)}・匯款 ${money(rev - cash)}</span>`),
    tile('銷售', live.filter(e => e.kind === 'sale').length + ' 筆', `<span>${fmtShort(hs.from)}–${fmtShort(hs.to)}</span>`),
    tile('套票核銷', sum(live.filter(e => e.kind === 'svc'), e => svq(e.rec)) + ' 堂', '<span>不計營收</span>'),
    tile('支出', money(sum(live.filter(e => e.kind === 'exp'), e => e.rec.amount)), `<span>${evs.filter(e => e.voided).length} 筆已作廢</span>`),
  ].join('');
  const shown = days.slice(0, hs.days);
  $('#hsLog').innerHTML = !evs.length ? '<p class="empty">這段期間沒有符合的紀錄</p>' : shown.map(d => {
    const st = dayStats(d), list = evs.filter(e => e.date === d);
    return `<section class="hist-day"><div class="hist-day-head"><h3>${fmtDate(d)}</h3><div class="sum"><span>實收 <b>${money(st.revenue)}</b></span><span><i class="dot" style="--dot:var(--cash)"></i> 現金 ${money(st.cash)}</span><span><i class="dot" style="--dot:var(--transfer)"></i> 匯款 ${money(st.transfer)}</span><span>${st.count} 筆銷售</span></div></div>
      <ul class="list">${list.map(evRow).join('')}</ul></section>`;
  }).join('') + (days.length > shown.length ? `<div style="text-align:center;margin-top:12px"><button type="button" class="btn" data-more>再顯示 ${Math.min(31, days.length - shown.length)} 天</button></div>` : '');
}
// 某一天營業結束時，各倉的數量（從所有紀錄推算）
function stockAsOf(D) {
  const res = {};
  S.products.forEach(p => { res[p.id] = {end:{}, delta:{}}; S.allWarehouses.forEach(w => { res[p.id].end[w.id] = 0; res[p.id].delta[w.id] = 0; }); });
  const add = (pid, wh, q, d) => { const r = res[pid]; if (!r || d > D) return; r.end[wh] = (r.end[wh] || 0) + q; if (d === D) r.delta[wh] = (r.delta[wh] || 0) + q; };
  S.moves.forEach(m => { if (m.type === 'transfer') { add(m.pid, m.wh, -m.qty, m.date); add(m.pid, m.to, m.qty, m.date); } else add(m.pid, m.wh, moveDelta(m, m.wh), m.date); });
  S.sales.forEach(s => s.items.forEach(it => { if (it.kind === 'product') add(it.ref, it.wh, -it.qty, s.date); }));
  S.stocktakes.forEach(t => t.lines.forEach(l => { if (l.diff) add(l.pid, t.wh, l.diff, t.date); }));
  return res;
}
const deltaText = n => n ? `<span class="per" style="color:${n > 0 ? 'var(--good)' : 'var(--bad)'}">${n > 0 ? '+' : '−'}${Math.abs(n)}</span>` : '';
const histWhs = (res = stockAsOf(hs.stockDate)) => S.allWarehouses.filter(w => !w.archived || S.products.some(p => res[p.id].end[w.id] || res[p.id].delta[w.id]));
function renderHistStockTable() {
  const D = hs.stockDate, res = stockAsOf(D), whs = histWhs(res), q = hs.stockQ.trim().toLowerCase();
  const rows = S.products.filter(p => !q || (p.name + p.sku).toLowerCase().includes(q));
  const tot = p => sum(whs, w => res[p.id].end[w.id]), dtot = p => sum(whs, w => res[p.id].delta[w.id]);
  const out = sum(S.products, p => sum(whs, w => Math.min(0, res[p.id].delta[w.id])));
  $('#hsSTiles').innerHTML = [
    tile('當天庫存成本', money(sum(S.products, p => tot(p) * p.cost)), '<span>以目前平均成本計</span>'),
    tile('當天庫存件數', num(sum(S.products, tot)), `<span>${S.products.length} 個品項</span>`),
    tile('當天減少', num(-out) + ' 件', '<span>銷售出貨、領用、盤虧</span>'),
    tile('當天增加', num(sum(S.products, p => sum(whs, w => Math.max(0, res[p.id].delta[w.id])))) + ' 件', '<span>進貨、期初、盤盈（調撥會一加一減）</span>'),
  ].join('');
  $('#hsSBody').innerHTML = rows.length ? rows.map(p => `<tr>
    <td class="mono hide-sm">${esc(p.sku)}</td><td class="c-head"><span class="nm">${esc(p.name)}</span><span class="meta show-sm">${esc(p.sku)}</span></td>
    ${whs.map(w => td(esc(whName(w.id)), `${res[p.id].end[w.id]}${deltaText(res[p.id].delta[w.id])}`, 'num')).join('')}
    ${td('合計', `${tot(p)} <span class="unit">${esc(p.unit)}</span>`, 'num strong')}
    ${td('當天增減', dtot(p) ? deltaText(dtot(p)).replace('class="per"', 'class=""') : '<span class="muted">—</span>', 'num')}
    ${td('庫存成本', money(tot(p) * p.cost), 'num')}
  </tr>`).join('') : `<tr><td colspan="${5 + whs.length}" class="empty">沒有符合的品項</td></tr>`;
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const csvLine = arr => arr.map(csvCell).join(',');
function exportHistory() {
  if (hs.tab === 'stock') {
    const D = hs.stockDate, res = stockAsOf(D), whs = histWhs(res);
    const lines = [csvLine(['日期', '品號', '品名', ...whs.map(w => whName(w.id)), '合計', '當天增減', '平均成本', '庫存成本'])];
    S.products.forEach(p => { const t = sum(whs, w => res[p.id].end[w.id]); lines.push(csvLine([D, p.sku, p.name, ...whs.map(w => res[p.id].end[w.id]), t, sum(whs, w => res[p.id].delta[w.id]), p.cost, Math.round(t * p.cost)])); });
    return saveFile(`庫存_${D}.csv`, lines.join('\r\n'));
  }
  const evs = histEvents().slice().reverse();
  const lines = [csvLine(['日期', '時間', '類型', '客人', '內容', '收款方式', '現金', '匯款', '儲值扣款', '金額', '數量', '倉庫', '狀態', '備註'])];
  evs.forEach(e => {
    const r = e.rec, status = e.voided ? '已作廢' + (r.voidAt ? ' ' + r.voidAt : '') : '';
    if (e.kind === 'sale') lines.push(csvLine([r.date, r.time, '銷售', custName(r.cust), r.items.map(it => `${it.name}${it.kind === 'course' ? '（' + (r.stored > 0 ? '儲值價' : OPT[it.opt]) + '）' : ''} x${it.qty}`).join('、'), PAY[payKind(r)], r.cash || 0, r.transfer || 0, r.stored || 0, r.total, '', [...new Set(r.items.filter(it => it.wh).map(it => whName(it.wh)))].join('、'), status, r.note || '']));
    else if (e.kind === 'svc') lines.push(csvLine([r.date, '', '套票核銷', custName(r.cust), courseName(r.course), '', '', '', '', '', svq(r), '', status, r.note || '']));
    else if (e.kind === 'move') { const p = product(r.pid) || {}; lines.push(csvLine([r.date, '', MOVE[r.type], '', p.name || '', '', '', '', '', r.type === 'in' && r.cost ? r.cost * r.qty : '', r.type === 'use' ? -r.qty : r.qty, r.type === 'transfer' ? `${whName(r.wh)}→${whName(r.to)}` : whName(r.wh), status, r.note || ''])); }
    else if (e.kind === 'stocktake') r.lines.filter(l => l.diff).forEach(l => lines.push(csvLine([r.date, '', '盤點調整', '', (product(l.pid) || {}).name || '', '', '', '', '', Math.round(l.diff * l.cost), l.diff, whName(r.wh), status, `系統 ${l.sys}・實盤 ${l.actual}`])));
    else lines.push(csvLine([r.date, '', '支出', '', `${r.cat} ${r.note || ''}`.trim(), PAY[r.pay] || r.pay, r.pay === 'cash' ? r.amount : '', r.pay === 'transfer' ? r.amount : '', '', r.amount, '', '', status, '']));
  });
  saveFile(`紀錄_${hs.from}_${hs.to}.csv`, lines.join('\r\n'));
}
function downloadLocal(filename, data, type='application/json;charset=utf-8') {
  const url = URL.createObjectURL(new Blob([data], {type}));
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
async function saveFile(filename, text) { downloadLocal(filename, '\uFEFF' + text, 'text/csv;charset=utf-8'); toast('已匯出 ' + filename); }

/* ---------- 設定、示範資料 ---------- */
async function replaceAll(next) {
  if (!client.canWrite() || batchScheduled) { toast('請先處理上一筆資料'); return false; }
  try {
    const saved = await client.replace(next); docs = clone(saved.docs); pos.cart = []; pos.cust = ''; st.counts = {}; rebuild(); refresh(); return true;
  } catch (error) { showLanError(error); return false; }
}
async function resetDemo() { if (await replaceAll(makeSeed())) toast('已載入示範資料'); }
async function clearAll() {
  const M = docs.master || {};
  if (await replaceAll({master:{warehouses:clone((M.warehouses || DEFAULT_WH).filter(w => !w.archived)), courses:clone(M.courses || defaultCourses()), plans:clone(M.plans || defaultPlans()), products:clone(M.products || {}), customers:{}}, ledger:{}})) toast('已清空資料');
}

/* ---------- 展示模式：僅保存此分頁的假資料 ---------- */
function setSync(state) {
  syncState = state;
  $('#sync').className = 'sync ' + (state === 'ok' ? 'ok' : 'error');
  $('#sync').textContent = { ok: '展示資料・已存此分頁', saving: '保存中…', error: '保存失敗', connecting: '載入假資料…' }[state] || state;
  $('#syncNote').textContent = '公開展示版｜所有資料皆為虛構。修改只保留在此瀏覽器分頁，關閉分頁後清除。請勿輸入個人或正式資料。';
  updateLanBanner(state);
}
function openSettings() {
  modal({ title: '展示設定', body: `
    <p class="privacy-tag">假資料展示，不連線正式帳本或 Google Sheets。</p>
    <p class="hint" style="margin:16px 0">可試用收銀、商品進貨、倉庫調撥、儲值、課程與月報表。重新整理會保留此分頁的操作；關閉分頁後清除。</p>
    <div class="actions"><button type="button" class="btn" id="demoReset">重設示範資料</button><button type="button" class="btn" id="demoBackup">下載展示備份</button><button type="button" class="btn" id="manageWh">管理示範倉庫</button></div>`,
    onOpen: (fields, form, close) => {
      form.querySelector('#demoReset').onclick = () => {
        close();
        confirmBox('重設此分頁的假資料與操作紀錄？', resetDemo, '重設示範資料');
      };
      form.querySelector('#demoBackup').onclick = () => downloadLocal('展示假資料備份.json', JSON.stringify({ v: 2, ...client.snapshot() }));
      form.querySelector('#manageWh').onclick = () => { close(); openWarehouses(); };
    }
  });
}
function updateLanBanner(state) {
  const banner = $('#lanBanner');
  banner.hidden = state !== 'error';
  if (state === 'error') banner.textContent = '瀏覽器保存失敗。請保留畫面，複製需要的內容後使用新的分頁重試。';
  $('.main').inert = state !== 'ok';
}
function showLanError(error) { toast(error.message, 6000); }
async function start() {
  MODE = 'lan';
  try {
    client = new DemoClient({ storage: sessionStorage, seed: makeSeed, onState: setSync });
    docs = clone((await client.load()).docs);
    rebuild();
    renderNav();
    renderView();
  } catch (error) {
    $('#boot').textContent = '瀏覽器無法保存展示資料，請允許此網站儲存資料後重新整理。';
    showLanError(error);
  }
}

window.addEventListener('beforeunload', event => { if (batchScheduled || client && (client.busy || client.pending)) { event.preventDefault(); event.returnValue = ''; } });
window.addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
start();
})();
</script>
